services:
  - type: web
    name: ai-travel-assistant
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_API_KEY
        sync: false
